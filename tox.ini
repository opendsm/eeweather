[tox]
envlist = 3.{11, 12, 13, 14}, minimum
# the minimum env resolves through uv; tox provisions the plugin when it is missing
requires = tox-uv>=1.36

[testenv]
package = editable
# the tooling carries floors because lowest-direct on an unbounded requirement
# picks sdists that no longer build
deps =
    pytest>=8
    pytest-cov>=5
    pytest-xdist>=3
    pytz>=2024.1
    syrupy>=5,<6
commands =
    pytest tests/

[testenv:minimum]
# Resolves every direct dependency, of the package and of the tooling above, to
# its declared floor.
basepython = python3.11
uv_resolution = lowest-direct

[testenv:coverage]
# Runs serially: the tracer can't attach to xdist workers, and -p
# no:xdist would leave the -n flag from addopts unparseable.
commands =
    pytest tests/ -o addopts= --cov=eeweather --cov-report=term-missing --cov-report=xml
