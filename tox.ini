[tox]
envlist = 3.{10, 11, 12, 13, 14}

[testenv]
package = editable
deps =
    pytest
    pytest-cov
    pytest-xdist
    pytz
    syrupy>=5,<6
commands =
    pytest tests/

[testenv:coverage]
# Runs serially: the tracer can't attach to xdist workers, and -p
# no:xdist would leave the -n flag from addopts unparseable.
commands =
    pytest tests/ -o addopts= --cov=eeweather --cov-report=term-missing --cov-report=xml
