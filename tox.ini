[tox]
envlist = 3.{10, 11, 12, 13, 14}

[testenv]
package = editable
deps =
    pytest
    pytest-cov
    pytest-xdist
    syrupy>=5,<6
commands =
    pytest tests/

[testenv:coverage]
# Runs serially: the tracer can't attach to xdist workers.
commands =
    pytest tests/ -p no:xdist --cov=eeweather --cov-report=term-missing --cov-report=xml
