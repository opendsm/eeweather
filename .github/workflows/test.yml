name: Test

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    # run monthly to monitor dependency updates
    - cron: "0 0 1 * *"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install tox
        run: pip install tox tox-uv
      - name: Enforce the coverage floor
        run: tox -e coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (logic checks only)
        run: ruff check eeweather tests

  build:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        resolution: [highest]
        include:
          # every direct dependency at its declared floor; the differing
          # `resolution` value makes this a new 3.11 / ubuntu combination, so
          # it is covered by `build (all)`
          - python: "3.11"
            os: ubuntu-latest
            resolution: lowest
            toxenv: minimum
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Python ${{ matrix.python }} on ${{ matrix.os }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: pip install tox tox-uv
      - name: Check uv.lock is current
        if: matrix.resolution == 'lowest'
        # before tox: its uv plugin leaves a `.venv` pointer file in the checkout that uv
        # refuses as a project environment; uv is on PATH because tox-uv depends on it
        run: uv lock --check
      - name: Run tox
        run: tox -e ${{ matrix.toxenv || matrix.python }}

  # The publish workflow never runs on pull requests, so build the distribution
  # here to catch packaging breakage before release day
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  # Fan-in over the build matrix so branch protection can require a single
  # context instead of every (python, os) combination. needs.build.result is
  # 'success' only if every matrix combination passed.
  build-all:
    name: build (all)
    if: always()
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs and the package build passed
        if: needs.build.result != 'success' || needs.package.result != 'success'
        run: |
          echo "build matrix result: ${{ needs.build.result }}"
          echo "package result: ${{ needs.package.result }}"
          exit 1
