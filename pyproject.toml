[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eeweather"
dynamic = ["version"]
description = "Weather station wrangling for EEmeter"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "opendsm", email = "opendsm@lists.lfenergy.org" }]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "click",
  "pandas>=1.0.0",
  "pyproj>=1.9.6",
  "pytz",
  "requests",
  "shapely",
]

[project.optional-dependencies]
dev = [
  "black",
  "coverage",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "syrupy>=5,<6",
  "tox",
]

[project.scripts]
eeweather = "eeweather.cli:cli"

[project.urls]
Homepage = "https://github.com/opendsm/eeweather"
Documentation = "https://opendsm.energy"
Repository = "https://github.com/opendsm/eeweather"
Issues = "https://github.com/opendsm/eeweather/issues"

[tool.hatch.version]
path = "eeweather/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["eeweather"]

[tool.pytest.ini_options]
# --cov / --cov-report are off by default to keep normal runs fast; coverage
# runs via `tox -e coverage`.
addopts = [
  "-n", "auto",            # parallel run (pytest-xdist)
  "-vv",                   # verbose
]
filterwarnings = [
  "error",
]

[tool.coverage.run]
omit = [
  ".tox/*",
  # metadata-db rebuild code; runs against live primary sources, not unit-testable
  "eeweather/database.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
# Conservative floor for `tox -e coverage`. Raise it as test coverage is
# added. The full suite measures 95.3%.
fail_under = 94
