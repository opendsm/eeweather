[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eeweather"
dynamic = ["version"]
description = "Obtain weather station data for OpenDSM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "opendsm", email = "opendsm@lists.lfenergy.org" }]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "numpy",
  "pandas>=2.2",
  "platformdirs",
  "pyproj>=1.9.6",
  "requests",
  "shapely",
]

[project.optional-dependencies]
# rebuilding the geography pack reads the Census state shapefile; a
# maintenance-only dependency, not needed to use the package
build = [
  "pyshp",
]
dev = [
  "black",
  "coverage",
  "pytest",
  "pytz",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "pyshp",
  "syrupy>=5,<6",
  "tox",
]

[project.urls]
Homepage = "https://github.com/opendsm/eeweather"
Documentation = "https://opendsm.energy"
Repository = "https://github.com/opendsm/eeweather"
Issues = "https://github.com/opendsm/eeweather/issues"

[tool.hatch.version]
path = "eeweather/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["eeweather"]

[tool.pytest.ini_options]
markers = [
  "live: exercises the real NASA POWER API; set EEWEATHER_LIVE_TESTS=1 to run",
]
# --cov / --cov-report are off by default to keep normal runs fast; coverage
# runs via `tox -e coverage`.
addopts = [
  "-n", "auto",            # parallel run (pytest-xdist)
  "-vv",                   # verbose
]
filterwarnings = [
  "error",
]
# pytest's default norecursedirs includes "build", which would silently
# skip tests/build/; keep the rest of the defaults
norecursedirs = [".*", "*.egg", "dist", "venv"]

[tool.ruff.lint]
# logic checks only; the project is deliberately not auto-formatted
select = ["F"]

[tool.coverage.run]
omit = [
  ".tox/*",
  # registry maintenance runs against live primary sources or the packaged
  # database of a previous schema; not unit-testable
  "eeweather/build/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
# Floor for `tox -e coverage`; the full suite measures 98.2%.
fail_under = 97
